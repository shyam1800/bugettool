<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Sections">
    <div class="brand" aria-hidden="true">
      <span class="brand-mark"><i></i><i></i><i></i></span><span class="brand-name">Budget</span>
    </div>
    <a href="#dashboard" data-route="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Dashboard</span></a>
    <a href="#trends" data-route="trends">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Trends</span></a>
    <a href="#budget" data-route="budget">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 10h18M9 5v14M15 5v14"/></svg><span>Plan</span></a>
    <a href="#transactions" data-route="transactions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Records</span></a>
    <a href="#fixed" data-route="fixed">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><span>Standard</span></a>
    <a href="#settings" data-route="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></a>
    <button type="button" class="nav-add" data-action="add-tx">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add record</span></button>
  </nav>

  <main id="main">
    <header id="top">
      <h1 id="title">Dashboard</h1>
      <button type="button" id="sync-chip" data-action="sync-chip" class="chip"><span class="dot"></span><span id="sync-text">Saved on this device</span></button>
    </header>
    <div id="view"></div>
  </main>

  <button type="button" id="fab" data-action="add-tx" aria-label="Add record">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<dialog id="tx-dialog" aria-labelledby="tx-title">
  <form id="tx-form" method="dialog" novalidate>
    <h2 id="tx-title">Add record</h2>
    <div class="seg" role="radiogroup" aria-label="Type">
      <label><input type="radio" name="ty" value="Income"><span>Income</span></label>
      <label><input type="radio" name="ty" value="Expenses" checked><span>Expenses</span></label>
      <label><input type="radio" name="ty" value="Savings"><span>Savings</span></label>
    </div>
    <label class="field"><span>Amount</span>
      <input id="tx-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0 — sums like 5514+3308 work too" required>
      <small id="tx-amount-hint" class="hint"></small></label>
    <label class="field"><span>Category</span><select id="tx-cat" required></select></label>
    <label class="field"><span>Date</span><input id="tx-date" type="date" required></label>
    <label class="field"><span>Details</span><input id="tx-note" type="text" autocomplete="off" placeholder="Optional"></label>
    <p id="tx-error" class="error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn danger-text" id="tx-delete" data-action="delete-tx" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-action="close-dialog">Cancel</button>
      <button type="button" class="btn" id="tx-save-more" data-action="save-tx-more">Save and add another</button>
      <button type="submit" class="btn primary" id="tx-save">Save record</button>
    </div>
  </form>
</dialog>

<dialog id="menu-dialog"><div id="menu-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<input type="file" id="excel-file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
